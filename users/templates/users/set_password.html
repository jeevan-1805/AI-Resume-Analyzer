{% extends 'base.html' %}

{% block title %}
Set Password
{% endblock %}

{% block content %}

<div class="card setpass">

    <h2>
        Set Password
    </h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="profile-btn"
        >

            Save Password

        </button>

    </form>

</div>

{% endblock %}
